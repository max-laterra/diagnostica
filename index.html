<style>
:root{--paper:#EEF0EA;--card:#FFFFFF;--ink:#141B18;--ink-soft:#57625D;--line:#D5D9CF;--line-strong:#AEB5A8;--accent:#1E6F5C;--accent-ink:#FFFFFF;
  --ok:#1E7A4F;--att:#9A6200;--err:#B3261E;--info:#35569B;--ok-f:#E2F2E9;--att-f:#FFF1D1;--err-f:#FBE3E1;--info-f:#E6ECF8;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--shadow:0 6px 22px rgba(20,27,24,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--paper:#111614;--card:#1A211E;--ink:#E8EDE9;--ink-soft:#A0ABA5;--line:#2C3531;--line-strong:#48544E;--accent:#4FB397;--accent-ink:#0B1310;
  --ok:#5FCB94;--att:#F0B44C;--err:#F08A80;--info:#8FB0EE;--ok-f:#15281E;--att-f:#2E2513;--err-f:#341B19;--info-f:#18213A;--shadow:0 6px 22px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:12px;min-height:60px}
.top-in img{height:26px;width:auto;display:block}
.tit{font-weight:700;font-size:1.15rem;letter-spacing:-.01em;user-select:none;-webkit-user-select:none;cursor:default;padding:6px 2px}
.top-in .quando{margin-left:auto;font-size:.85rem;color:var(--ink-soft);text-align:right;min-width:0}
@media (max-width:560px){.top-in{gap:8px}.top-in .quando{display:none}.top-in img{height:20px}.tit{font-size:1.05rem}#controlla{margin-left:auto}} /* sul telefono: l'ora del controllo è già nel riquadro sotto */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.97rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.piccolo{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
main{padding-top:16px}
.riassunto{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.sem{flex:0 0 64px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;font-weight:800;color:#fff}
.sem.ok{background:var(--ok)}.sem.att{background:var(--att)}.sem.err{background:var(--err)}.sem.wait{background:var(--line-strong)}
.riassunto h1{font-size:1.3rem;margin:0 0 2px;letter-spacing:-.01em}
.riassunto p{margin:0;color:var(--ink-soft);font-size:.93rem}
.problemi{display:grid;gap:8px;margin-bottom:18px}
.pb{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--att);border-radius:12px;padding:11px 13px}
.pb.err{border-left-color:var(--err)}.pb.info{border-left-color:var(--info)}
.pb b{display:block;font-size:.98rem}
.pb .cosa{font-size:.9rem;color:var(--ink-soft);margin-top:3px}
.pb .dove{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.griglia{display:grid;gap:14px}
@media (min-width:980px){.griglia{grid-template-columns:1fr 1fr;align-items:start}}
details.sez{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
details.sez>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;font-weight:700}
details.sez>summary::-webkit-details-marker{display:none}
details.sez>summary .freccia{margin-left:auto;color:var(--ink-soft);transition:transform .2s}
details.sez[open]>summary .freccia{transform:rotate(90deg)}
.chip{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-f);color:var(--ok)}.chip.att{background:var(--att-f);color:var(--att)}.chip.err{background:var(--err-f);color:var(--err)}.chip.info{background:var(--info-f);color:var(--info)}
.corpo{padding:0 16px 16px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding-top:12px;font-size:.93rem}
.kv span{color:var(--ink-soft)}
.kv b{text-align:right;font-weight:600;overflow-wrap:anywhere}
.lista{display:grid;gap:8px;padding-top:12px}
.voce{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}
.voce .t{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.voce .s{color:var(--ink-soft);font-size:.86rem;margin-top:2px}
.voce .righe{display:grid;gap:3px;margin-top:6px}
.pallino{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--line-strong)}
.pallino.ok{background:var(--ok)}.pallino.att{background:var(--att)}.pallino.err{background:var(--err)}.pallino.info{background:var(--info)}
.azioni{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
.registro{font:500 .8rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--ink) 5%,var(--card));border-radius:10px;padding:10px;margin-top:12px;max-height:240px;overflow:auto;white-space:pre-wrap}
.sotto{font-size:.85rem;color:var(--ink-soft);margin:12px 0 0}
.h4{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 0}
/* accesso e impostazioni */
.scheda{max-width:480px;margin:6vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.scheda .testa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 20px 14px;border-bottom:4px solid #FFB21A}
.scheda .testa img{height:40px;width:auto}
.scheda .testa b{letter-spacing:.3em;font-size:.9rem;color:var(--ink-soft);padding-left:.3em}
.scheda .dentro{padding:18px 20px 20px;display:grid;gap:12px}
.scheda h2{margin:0;font-size:1.35rem}
.campo label{display:block;font-size:.9rem;color:var(--ink-soft);margin-bottom:5px}
.campo input,.campo select{width:100%;min-height:50px;border:1.5px solid var(--line-strong);border-radius:12px;padding:0 12px;background:var(--paper)}
.msg{min-height:1.3em;color:var(--err);font-weight:600;font-size:.92rem;margin:0}
.passi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.93rem}
.passi ol{margin:6px 0 0;padding-left:1.2em;display:grid;gap:4px}
.resta{display:flex;align-items:center;gap:10px}
.resta input{width:22px;height:22px;accent-color:var(--accent)}
.imp{display:grid;gap:14px}
.imp .riq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.imp h3{margin:0;font-size:1.05rem}
.imp p{margin:0;font-size:.92rem;color:var(--ink-soft)}
.modale{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modale .box{background:var(--card);border-radius:18px;max-width:440px;width:100%;padding:20px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modale h3{margin:0}
.modale p{margin:0;color:var(--ink-soft)}
.modale .tasti{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

<script>
(function(){
"use strict";
const VERSIONE="1.0";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fra=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d);};
const dOf=s=>{const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const GL=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"],MS=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const giorno=s=>{const d=dOf(s);return GL[d.getDay()]+" "+d.getDate()+" "+MS[d.getMonth()];};
const attesa=ms=>new Promise(ok=>setTimeout(ok,ms));
function fa(t){
  const ms=Date.now()-Date.parse(t);if(!t||isNaN(ms))return "mai";
  const m=Math.round(ms/60000);if(m<1)return "adesso";if(m<60)return m+(m===1?" minuto fa":" minuti fa");
  const h=Math.round(m/60);if(h<24)return h+(h===1?" ora fa":" ore fa");const g=Math.round(h/24);return g===1?"ieri":g+" giorni fa";
}
const minuti=t=>{const ms=Date.now()-Date.parse(t);return isNaN(ms)?Infinity:ms/60000;};
const quando=t=>{const d=new Date(t);if(isNaN(d))return "—";return d.getDate()+" "+MS[d.getMonth()]+" alle "+pad(d.getHours())+":"+pad(d.getMinutes());};
let toastT=null;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3200);}
const lsG=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(_){return null;}};
const lsS=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(_){}};
const K={conn:"diag-collegamento",pw:"diag-pw",sess:"diag-sessione",supa:"diag-archivio",ind:"diag-indirizzi",tent:"diag-tentativi",cache:"diag-cache",blocco:"diag-bloccato"};
const IND_PRED={autisti:"https://max-laterra.github.io/autisti_prova/",presenze:"https://max-laterra.github.io/presenze/"};
const indirizzi=()=>Object.assign({},IND_PRED,lsG(K.ind)||{});

// ---------- nomi (come nel servizio notifiche) ----------
const idDi=n=>String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const pulisci=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const chiaveNome=t=>pulisci(t).split(" ").filter(Boolean).sort().join(" ");
const chiaveSlug=s=>String(s).split("-").filter(Boolean).sort().join(" ");
const SOPRANNOMI={saro:"rosario",turi:"salvatore",toto:"salvatore",pippo:"giuseppe",peppe:"giuseppe",peppino:"giuseppe",pino:"giuseppe",beppe:"giuseppe",gianni:"giovanni",nino:"antonino",enzo:"vincenzo",ciccio:"francesco",tano:"gaetano",melo:"carmelo",gigi:"luigi",piero:"pietro"};
const attaccati=k=>{const t=k.split(" ").filter(Boolean).slice(0,5),out=new Set();const via=(pre,resto)=>{if(!resto.length){out.add(pre);return;}resto.forEach((x,i)=>via(pre+x,resto.filter((_,j)=>j!==i)));};via("",t);return out;};
const senzaSopr=k=>k.split(" ").map(w=>SOPRANNOMI[w]||w).sort().join(" ");
function trovaDip(dip,slug){
  const k=chiaveSlug(slug),unico=t=>{const v=t.filter(d=>!d.eliminato);return v.length===1?v[0]:null;};
  const es=dip.filter(d=>d.k===k);if(es.length)return es.find(d=>!d.eliminato)||es[0];
  const prova=(c,f)=>{const a=attaccati(c);return unico(dip.filter(d=>[...attaccati(f(d.k))].some(x=>a.has(x))));};
  return prova(k,x=>x)||prova(senzaSopr(k),senzaSopr)||null;
}
const verOk=v=>/^\d+(\.\d+)+$/.test(String(v||""));
const confrontaVer=(a,b)=>{const x=String(a).split(".").map(Number),y=String(b).split(".").map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d;}return 0;};

// ---------- Dropbox (con il collegamento «telefono» Diagnostica) ----------
const API="https://api.dropboxapi.com",CONT="https://content.dropboxapi.com";

async function token(forza){

const argH=o=>JSON.stringify(o).replace(/[\u007f-￿]/g,c=>"\\u"+("000"+c.charCodeAt(0).toString(16)).slice(-4));
async function chiama(url,o,giro){

async function rpc(fn,corpo){

async function elenca(path,ricorsivo){

async function scaricaJson(path){

async function supaAuth(cfg,corpo,tipo){
  let r;try{r=await fetchT(cfg.url.replace(/\/+$/,"")+"/auth/v1/token?grant_type="+tipo,{method:"POST",headers:{apikey:cfg.chiave,"Content-Type":"application/json"},body:JSON.stringify(corpo)},30000);}catch(_){throw new Error("archivio non raggiungibile");}
  const t=await r.text();if(!r.ok){let m="";try{const j=JSON.parse(t);m=j.error_description||j.msg||j.message||"";}catch(_){}throw new Error("accesso all'archivio rifiutato ("+r.status+(m?": "+m:"")+")");}
  const j=JSON.parse(t);cfg.a=j.access_token;cfg.r=j.refresh_token;cfg.exp=Date.now()+((j.expires_in||3600)-120)*1000;lsS(K.supa,{url:cfg.url,chiave:cfg.chiave,email:cfg.email,a:cfg.a,r:cfg.r,exp:cfg.exp});return cfg;
}
async function supaGet(cfg,percorso){
  if(!cfg.a||Date.now()>cfg.exp)await supaAuth(cfg,{refresh_token:cfg.r},"refresh_token");
  for(let giro=0;giro<2;giro++){
    let r;try{r=await fetchT(cfg.url.replace(/\/+$/,"")+"/rest/v1/"+percorso,{headers:{apikey:cfg.chiave,Authorization:"Bearer "+cfg.a}},30000);}catch(_){throw new Error("archivio non raggiungibile");}
    const t=await r.text();
    if(r.status===401&&!giro){await supaAuth(cfg,{refresh_token:cfg.r},"refresh_token");continue;}
    if(r.status===404)throw new Error("tabella non trovata");
    if(r.status>=500)throw new Error("l'archivio non ha risposto ("+r.status+")");
    if(!r.ok)throw new Error("errore "+r.status);
    return t?JSON.parse(t):[];
  }
}

// ---------- versione pubblicata su GitHub: si leggono solo le prime righe ----------
async function versioneOnline(url,re){
  const r=await fetchT(url.replace(/\/?$/,"/")+"index.html",{cache:"no-store"},20000);
  if(!r.ok)throw new Error("risposta "+r.status);
  let testo="";
  if(r.body&&r.body.getReader){const rd=r.body.getReader(),dec=new TextDecoder();while(testo.length<6000){const x=await rd.read();if(x.done)break;testo+=dec.decode(x.value,{stream:true});}try{rd.cancel();}catch(_){}}
  else testo=(await r.text()).slice(0,6000);
  const m=re.exec(testo);return m?m[1]:"";
}

// lo stato del servizio si cambia solo con il lucchetto preso (come fa il servizio a ogni giro): niente sovrapposizioni
async function conLucchetto(nota,fn){
  let preso=false;
  for(let i=0;i<6&&!preso;i++){
    if(await scrivi(LUCCHETTO,{da:new Date().toISOString(),chi:"diagnostica"},"add")){preso=true;break;}
    const x=await scaricaJson(LUCCHETTO),t=x&&x.j&&Date.parse(x.j.da);
    if(!t||Date.now()-t>90000){await cancella(LUCCHETTO).catch(()=>{});continue;}
    if(i<5)await attesa(3000);
  }
  if(!preso)throw new Error("Il servizio sta lavorando in questo momento: riprova tra un minuto");
  try{
    const x=await scaricaJson(STATO);if(!x||!x.j)throw new Error("Stato del servizio non trovato");
    const st=x.j;fn(st);st.log=st.log||[];st.log.unshift(new Date().toISOString().slice(0,16)+" Diagnostica: "+nota);st.log=st.log.slice(0,30);
    await scrivi(STATO,st);
  }finally{await cancella(LUCCHETTO).catch(()=>{});}
}

    fa:()=>conLucchetto("tolte le notifiche in attesa",st=>{st.coda=[];}),ok:"Fatto: notifiche in attesa tolte"},
  riposi:{t:"Rimandare i riposi a tutti i telefoni?",d:"Al prossimo giro il servizio rilegge le Presenze e riscrive riposi e rimesse per tutti gli autisti. Non manda notifiche doppie.",si:"Rimanda",
    fa:()=>conLucchetto("riposi e rimesse da rimandare a tutti i telefoni",st=>{st.ponte=st.ponte||{};st.ponte.hashRiposi={};st.ponte.riposiAt=0;}),ok:"Fatto: i riposi ripartono entro un paio di minuti"},
  conferme:{t:"Ricopiare le conferme nelle Presenze?",d:"Al prossimo giro il servizio riscrive nell'archivio chi ha premuto OK sui riposi e sulle rimesse.",si:"Ricopia",
    fa:()=>conLucchetto("conferme dei riposi da ricopiare nelle Presenze",st=>{st.ponte=st.ponte||{};st.ponte.vistiHash="";}),ok:"Fatto: le conferme si ricopiano entro un paio di minuti"},
  lucchetto:{t:"Togliere il lucchetto?",d:"Il lucchetto serve a non far lavorare il servizio due volte insieme. Se è rimasto preso da più di due minuti, toglierlo fa ripartire il servizio.",si:"Togli",
    fa:async()=>{const x=await scaricaJson(LUCCHETTO);if(x&&x.j&&minuti(x.j.da)<2)throw new Error("Il lucchetto è appena stato preso: il servizio sta lavorando");await cancella(LUCCHETTO);},ok:"Fatto: lucchetto tolto"}
};
async function ripara(k){
  if(k.startsWith("prova:")){
    const tel=k.slice(6),path="/telefoni/push/"+tel+".json",x=await scaricaJson(path);if(!x||!x.j)return toast("Iscrizione alle notifiche non trovata");
    const nome=x.j.autista||tel;
    if(!(await chiedi("Mandare una notifica di prova?","Sul telefono di "+nome+" arriva «Prova riuscita» entro un paio di minuti.","Manda")))return;
    try{x.j.prova=new Date().toISOString();await scrivi(path,x.j);toast("Inviata: arriva sul telefono di "+nome+" entro un paio di minuti");}catch(e){toast("Non riuscita: "+e.message);}
    return;
  }
  const r=RIP[k];if(!r)return;
  if(!(await chiedi(r.t,r.d,r.si)))return;
  try{await r.fa();toast(r.ok);setTimeout(()=>controlla(true),2500);}catch(e){toast(e.message||"Non riuscita");}
}

// ============================================================
//  5. ACCESSO: collegamento, password, impostazioni nascoste
// ============================================================
function leggiCodice(t){
  const m=/(?:^|[#&?])c=([A-Za-z0-9_-]{20,})/.exec(String(t||""));if(!m)return null;
  try{let s=m[1].replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    const j=JSON.parse(new TextDecoder().decode(u));if(j&&j.v===1&&j.k&&j.r&&j.p)return {k:String(j.k),r:String(j.r),a:String(j.a||"Diagnostica"),p:String(j.p),at:new Date().toISOString()};}catch(_){}
  return null;
}
async function impronta(pw,sale,giri){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:new TextEncoder().encode(sale),iterations:giri},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const scheda=(tit,corpo)=>'<div class="scheda"><div class="testa"><img alt="La Terra" src="'+document.querySelector("header img").src+'"><b>DIAGNOSTICA</b></div><div class="dentro"><h2>'+tit+'</h2>'+corpo+'</div></div><p class="vers">La Terra · Diagnostica · versione '+VERSIONE+'</p>';
function schermataCollega(msg){
  $("testata").hidden=true;
  $("pagina").innerHTML=scheda("Collega la diagnostica",(msg?'<p class="msg">'+msg+'</p>':"")+
    '<div class="passi"><b>Come si fa</b><ol><li>Nell\'Agenda: Pannello Super Master › Autisti › Collega un telefono.</li><li>Come nome scrivi «Diagnostica».</li><li>Tocca «Copia il link».</li><li>Incollalo qui sotto e tocca «Collega».</li></ol></div>'+
    '<div class="campo"><label for="link">Link della diagnostica</label><input id="link" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…#c=…"></div><p class="msg" id="msg"></p><button class="btn" data-az="collega">Collega</button>');
}
function schermataCreaPw(){
  $("testata").hidden=true;
  $("pagina").innerHTML=scheda("Scegli una password",'<p style="margin:0;color:var(--ink-soft)">La diagnostica può fare riparazioni: serve una password per aprirla.</p>'+
    '<div class="campo"><label for="pw1">Password (almeno 8 caratteri)</label><input id="pw1" type="password" autocomplete="new-password"></div><div class="campo"><label for="pw2">Scrivila di nuovo</label><input id="pw2" type="password" autocomplete="new-password"></div>'+
    '<label class="resta"><input type="checkbox" id="resta">Resta collegato su questo dispositivo</label><p class="msg" id="msg"></p><button class="btn" data-az="creapw">Salva ed entra</button>');
}
function schermataPw(){
  $("testata").hidden=true;
  $("pagina").innerHTML=scheda("Entra",'<div class="campo"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div><label class="resta"><input type="checkbox" id="resta">Resta collegato su questo dispositivo</label><p class="msg" id="msg"></p><button class="btn" data-az="entra">Entra</button>');
  setTimeout(()=>{const i=$("pw");if(i)i.focus();},50);
}
let tent=lsG(K.tent)||{n:0,fino:0};
async function entra(){
  const msg=$("msg"),pw=$("pw").value,ora=Date.now(),h=lsG(K.pw);
  if(ora<tent.fino){msg.textContent="Troppi tentativi: aspetta "+Math.ceil((tent.fino-ora)/1000)+" secondi.";return;}
  if(h&&(await impronta(pw,h.sale,h.giri))===h.h){tent={n:0,fino:0};lsS(K.tent,null);sessionStorage.setItem("diag-dentro","1");if($("resta").checked)lsS(K.sess,true);return apri();}
  tent.n++;if(tent.n%5===0)tent.fino=ora+(tent.n>=10?300000:30000);lsS(K.tent,tent);msg.textContent=tent.fino>ora?"Troppi tentativi: aspetta.":"Password sbagliata.";$("pw").value="";
}
async function creaPw(){
  const a=$("pw1").value,b=$("pw2").value,msg=$("msg");
  if(a.length<8){msg.textContent="Almeno 8 caratteri.";return;}if(a!==b){msg.textContent="Le due password non sono uguali.";return;}
  const sale=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
  lsS(K.pw,{sale,giri:200000,h:await impronta(a,sale,200000)});sessionStorage.setItem("diag-dentro","1");if($("resta").checked)lsS(K.sess,true);apri();
}
let impAperte=false,tocchi=[],autoT=null;
function apri(){
  impAperte=false;$("testata").hidden=false;controlla(true);
  clearInterval(autoT);autoT=setInterval(()=>{if(!document.hidden&&!impAperte)controlla(true);},120000);
}
function impostazioni(){
  impAperte=true;const s=lsG(K.supa)||{},ind=indirizzi();
  $("pagina").innerHTML='<div style="margin-bottom:8px"><button class="btn ghost piccolo" data-az="imp-chiudi">‹ Diagnostica</button></div><div class="imp">'+
    '<div class="riq"><h3>Collegamento con Dropbox</h3><p>Collegata come «'+esc(conn.a)+'» (telefono «'+esc(conn.p)+'») '+(conn.at?"dal "+quando(conn.at):"")+'.</p>'+
      '<div class="campo"><label for="link">Nuovo link (solo se va cambiato)</label><input id="link" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…#c=…"></div><button class="btn ghost" data-az="cambia-link">Cambia collegamento</button></div>'+
    '<div class="riq"><h3>Archivio Presenze (Supabase)</h3><p>'+(s.r?"Collegato con "+esc(s.email||"")+".":"Non collegato. Usa gli stessi dati dell'app Presenze (scheda Dipendenti › Telefono e computer insieme).")+'</p>'+
      '<div class="campo"><label for="sUrl">Indirizzo</label><input id="sUrl" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://xxxx.supabase.co" value="'+esc(s.url||"")+'"></div>'+
      '<div class="campo"><label for="sKey">Chiave pubblica (anon)</label><input id="sKey" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(s.chiave||"")+'"></div>'+
      '<div class="campo"><label for="sMail">Email</label><input id="sMail" type="email" autocomplete="off" value="'+esc(s.email||"")+'"></div>'+
      '<div class="campo"><label for="sPw">Password dell\'archivio</label><input id="sPw" type="password" autocomplete="off"></div>'+
      '<p class="msg" id="sMsg"></p><div class="azioni" style="padding-top:0"><button class="btn" data-az="supa-collega">Collega l\'archivio</button>'+(s.r?'<button class="btn ghost" data-az="supa-scollega">Scollega</button>':"")+'</div><p>La password non viene salvata: resta solo l\'accesso.</p></div>'+
    '<div class="riq"><h3>Indirizzi delle app</h3><div class="campo"><label for="iA">App autisti</label><input id="iA" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(ind.autisti)+'"></div>'+
      '<div class="campo"><label for="iP">App Presenze</label><input id="iP" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(ind.presenze)+'"></div><button class="btn ghost" data-az="salva-ind">Salva gli indirizzi</button></div>'+
    '<div class="riq"><h3>Password</h3><div class="campo"><label for="np1">Nuova password (almeno 8 caratteri)</label><input id="np1" type="password" autocomplete="new-password"></div><div class="campo"><label for="np2">Scrivila di nuovo</label><input id="np2" type="password" autocomplete="new-password"></div><button class="btn ghost" data-az="cambia-pw">Cambia password</button></div>'+
    '<div class="riq"><h3>Uscire</h3><p>«Esci» chiede di nuovo la password. «Scollega questo dispositivo» cancella da qui collegamento, archivio e password.</p><div class="azioni" style="padding-top:0"><button class="btn ghost" data-az="esci">Esci</button><button class="btn ghost" data-az="scollega">Scollega questo dispositivo</button></div></div>'+
    '</div><p class="vers">La Terra · Diagnostica · versione '+VERSIONE+'</p>';
  window.scrollTo(0,0);
}
document.addEventListener("click",async e=>{
  const r=e.target.closest("[data-rip]");if(r){r.disabled=true;try{await ripara(r.dataset.rip);}finally{r.disabled=false;}return;}
  if(e.target.id==="titolo"){const ora=Date.now();tocchi=tocchi.filter(t=>ora-t<4000);tocchi.push(ora);if(tocchi.length>=6){tocchi=[];impostazioni();}return;}
  if(e.target.id==="controlla"){if(impAperte){impAperte=false;disegna();}return controlla(false);}
  const b=e.target.closest("[data-az]");if(!b)return;const az=b.dataset.az;
  if(az==="collega"){const c=leggiCodice($("link").value);if(!c){$("msg").textContent="Questo non è il link copiato dall'Agenda.";return;}lsS(K.conn,c);lsS(K.blocco,null);conn=c;tok=null;return lsG(K.pw)?schermataPw():schermataCreaPw();}
  if(az==="creapw")return creaPw();
  if(az==="entra")return entra();
  if(az==="imp-chiudi"){impAperte=false;if(D)disegna();else controlla(true);return;}
  if(az==="cambia-link"){const c=leggiCodice($("link").value);if(!c)return toast("Questo non è il link copiato dall'Agenda");if(!(await chiedi("Cambiare collegamento?","La diagnostica userà il nuovo link.","Cambia")))return;lsS(K.conn,c);conn=c;tok=null;toast("Collegamento cambiato");impAperte=false;D=null;return controlla(true);}
  if(az==="supa-collega"){const cfg={url:$("sUrl").value.trim(),chiave:$("sKey").value.trim(),email:$("sMail").value.trim()},pw=$("sPw").value,m=$("sMsg");
    if(!/^https:\/\/.+/.test(cfg.url)||!cfg.chiave||!cfg.email||!pw){m.textContent="Compila tutti i campi (l'indirizzo comincia con https://).";return;}
    m.style.color="var(--ink-soft)";m.textContent="Collego…";try{await supaAuth(cfg,{email:cfg.email,password:pw},"password");toast("Archivio collegato");impostazioni();}catch(err){m.style.color="";m.textContent=err.message;}return;}
  if(az==="supa-scollega"){lsS(K.supa,null);toast("Archivio scollegato");return impostazioni();}
  if(az==="salva-ind"){const a=$("iA").value.trim(),p=$("iP").value.trim();if(!/^https:\/\//.test(a)||!/^https:\/\//.test(p))return toast("Gli indirizzi cominciano con https://");lsS(K.ind,{autisti:a,presenze:p});return toast("Indirizzi salvati");}
  if(az==="cambia-pw"){const a=$("np1").value,c=$("np2").value;if(a.length<8)return toast("Almeno 8 caratteri");if(a!==c)return toast("Le due password non sono uguali");const sale=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");lsS(K.pw,{sale,giri:200000,h:await impronta(a,sale,200000)});$("np1").value=$("np2").value="";return toast("Password cambiata");}
  if(az==="esci"){lsS(K.sess,null);sessionStorage.removeItem("diag-dentro");clearInterval(autoT);D=null;return schermataPw();}
  if(az==="scollega"){if(!(await chiedi("Scollegare questo dispositivo?","Da questo dispositivo vengono cancellati collegamento, archivio e password. Per rientrare servirà un nuovo link dall'Agenda.","Scollega")))return;Object.values(K).forEach(k=>lsS(k,null));lsS("diag-aperte",null);sessionStorage.clear();clearInterval(autoT);conn=null;D=null;return schermataCollega();}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const t=e.target&&e.target.id;if(t==="pw")entra();else if(t==="pw2")creaPw();else if(t==="link"&&$("pagina").querySelector('[data-az="collega"]'))$("pagina").querySelector('[data-az="collega"]').click();});
// blocco automatico: dopo 15 minuti in sottofondo richiede la password (se non è stato scelto «Resta collegato»)
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){try{sessionStorage.setItem("diag-nascosta",String(Date.now()));}catch(_){}return;}
  const n=Number(sessionStorage.getItem("diag-nascosta"))||0;
  if(conn&&!lsG(K.sess)&&sessionStorage.getItem("diag-dentro")&&n&&Date.now()-n>15*60000){sessionStorage.removeItem("diag-dentro");clearInterval(autoT);D=null;impAperte=false;return schermataPw();}
  if(conn&&D&&!impAperte&&minuti(D.R.at)>2)controlla(true);
});

// ---------- avvio ----------
(function avvio(){
  const c=leggiCodice(location.hash);if(c){try{history.replaceState(null,"",location.pathname+location.search);}catch(_){}lsS(K.conn,c);lsS(K.blocco,null);}
  conn=lsG(K.conn);
  if(!conn||!conn.k||!conn.r)return schermataCollega(lsG(K.blocco)?"Il collegamento è stato bloccato nell'Agenda: serve un link nuovo.":"");
  if(!lsG(K.pw))return schermataCreaPw();
  if(lsG(K.sess)||sessionStorage.getItem("diag-dentro"))return apri();
  schermataPw();
})();
})();
